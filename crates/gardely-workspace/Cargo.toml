[package]
name = "gardely-workspace"
version = "0.1.0"
edition = "2024"
description = "Workspace services from GardelyCode: file tree & fs ops, ripgrep-powered search, debounced watcher, ConPTY terminals and a tiny static preview server"
license = "MIT"
repository = "https://github.com/null-byte00/gardelycode-community"
keywords = ["ide", "terminal", "pty", "file-watcher", "search"]
categories = ["development-tools", "filesystem"]

[dependencies]
serde = { version = "1", features = ["derive"] }
anyhow = "1"
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
portable-pty = "0.9.0"
tiny_http = "0.12.0"
